[putitoutthere]
version = 1

# Three artifacts, one binary. Python ships a maturin-built wheel per
# target; npm ships a top-level package + per-platform sub-packages.
# Cascade: edits under packages/rust/** retrigger PyPI + npm builds.

[[package]]
name = "steervec-rust"
kind = "crates"
crate = "steervec"
path = "packages/rust"
first_version = "0.0.1"
globs = [
  "packages/rust/**",
  "LICENSE",
]

[[package]]
name = "steervec-py"
kind = "pypi"
pypi = "steervec"
path = "packages/python"
first_version = "0.0.1"
build = "maturin"
depends_on = ["steervec-rust"]
globs = [
  "packages/python/**",
  "packages/rust/**",
  "LICENSE",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[[package]]
name = "steervec-npm"
kind = "npm"
npm = "steervec"
path = "packages/node"
first_version = "0.0.1"
build = [{ mode = "bundled-cli", name = "@steervec/{triple}" }]
depends_on = ["steervec-rust"]
globs = [
  "packages/node/**",
  "packages/rust/**",
  "LICENSE",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

# #12: the engine cross-compiles the per-target binaries, which stamps the
# crate version first (write-crate-version). packages/node/scripts/build.mjs
# did not, so every npm binary through 0.0.3 reported the previous release's
# version. Declaring this block is what ungates the bundled-cli steps —
# `build = [{ mode = "bundled-cli" }]` alone gates all of them off. Linux rows
# also move to cargo-zigbuild against a pinned glibc 2.17 floor.
[package.bundle_cli]
bin = "steervec"
crate_path = "packages/rust"
